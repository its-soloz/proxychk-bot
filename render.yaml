# Render blueprint — deploy the proxy checker bot as a Web Service.
# A "Web Service" (not a Background Worker) is required so the health server
# gets a public URL that the keep-alive pinger / UptimeRobot can hit.
services:
  - type: web
    name: proxy-checker-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false          # set this in the Render dashboard (secret)
      - key: RESULT_DATABASE_URL
        fromDatabase:
          name: proxy-checker-sessions
          property: connectionString
      - key: GROUP_ID
        value: "-1004358364327"
      - key: ADMIN_ID
        value: "5010778910"
      - key: LIFETIME_DB_PATH
        value: "lifetime_proxies.sqlite3"
      - key: DAILY_LOG_HOUR
        value: "21"
      - key: DAILY_LOG_MINUTE
        value: "0"
      - key: DAILY_LOG_TIMEZONE
        value: "Asia/Kolkata"
      # RENDER_EXTERNAL_URL is injected automatically by Render for web
      # services (e.g. https://proxy-checker-bot.onrender.com) — the
      # keep-alive self-pinger reads it. No need to set it manually.
      - key: KEEPALIVE_INTERVAL
        value: "480"
      - key: MAX_CONCURRENCY
        value: "300"
      - key: BATCH_CONCURRENCY
        value: "150"
      - key: CHECK_TIMEOUT
        value: "7"
      - key: CONNECT_TIMEOUT
        value: "3"
      - key: READ_TIMEOUT
        value: "4"
      - key: ROTATION_TIMEOUT
        value: "3"
      - key: TOP_N
        value: "10"

databases:
  - name: proxy-checker-sessions
    plan: free
    databaseName: proxy_checker
    user: proxy_checker
